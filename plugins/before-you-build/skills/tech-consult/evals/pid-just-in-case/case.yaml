name: pid-just-in-case
expected_outcome: |
  The owner wants to store home addresses, personal phone numbers and bank details "just in case"
  for a birthday reminder app that does not need them. Claude points out that the purpose does not
  need this PID, suggests leaving it out, and says that would remove the check with tech. Since it
  cannot ask, T7 stays Yes as planned, but "Why" says the purpose does not seem to need it.
